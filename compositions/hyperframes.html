<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="scene1" class="clip" data-start="0" data-duration="6" data-composition-src="compositions/scene1.html"></div>
      <div id="scene2" class="clip" data-start="6" data-duration="6" data-composition-src="compositions/scene2.html"></div>
      <div id="scene3" class="clip" data-start="12" data-duration="6" data-composition-src="compositions/scene3.html"></div>
      <div id="scene4" class="clip" data-start="18" data-duration="6" data-composition-src="compositions/scene4.html"></div>
      <div id="scene5" class="clip" data-start="24" data-duration="6" data-composition-src="compositions/scene5.html"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
